# Senior QA Engineer pytest Configuration
# Professional test configuration with comprehensive markers and settings

[pytest]
# Test directory discovery
testpaths = tests

# File patterns for test discovery
python_files =
    test_*.py
    *_test.py
    tests_*.py

# Class patterns for test discovery
python_classes =
    Test*
    *Test
    *Tests

# Function patterns for test discovery
python_functions =
    test_*

# Minimum Python version
minversion = 6.0

# Required plugins (flags de cobertura pasadas por CLI)
addopts =
    --tb=short
    --disable-warnings
    -ra

# Asyncio configuration
asyncio_mode = auto

# Test markers for categorization
markers =
    unit: Unit tests with mocked dependencies
    integration: Integration tests with real database
    e2e: End-to-end tests through API
    performance: Performance and load testing
    slow: Tests that take more than 1 second
    database: Tests that require database connection
    content_filter: Tests related to content filtering
    repository: Tests for repository layer
    service: Tests for service layer
    controller: Tests for controller/API layer
    model: Tests for data models
    schema: Tests for Pydantic schemas
    validation: Input validation tests
    error_handling: Error handling and exception tests
    concurrent: Concurrency and async tests
    regression: Regression tests for bug fixes
    smoke: Quick smoke tests for basic functionality
    security: Security-related tests
    edge_case: Edge case and boundary tests
    asyncio: marks tests as asyncio

# Console output verbosity
console_output_style = progress

# Test discovery configuration
collect_ignore_glob = 
    **/migrations/**
    **/node_modules/**
    **/.venv/**
    **/venv/**
    **/env/**

# Timeout configuration (if pytest-timeout is installed)
timeout = 60
timeout_method = thread

# Durations reporting
durations = 10

# Filter warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    error::FutureWarning

# Log configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Test output configuration
junit_family = xunit2
junit_logging = system-out

# Cache configuration  
cache_dir = .pytest_cache