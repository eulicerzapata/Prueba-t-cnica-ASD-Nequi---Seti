# ============================================================================
# Docker Compose para Chat Message API
# ============================================================================

services:
  # Servicio principal de la API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # Configuración de la aplicación
      - APP_NAME=Chat Message API
      - APP_VERSION=1.0.0
      - APP_DESCRIPTION=API RESTful para procesamiento de mensajes de chat

      # Configuración del servidor
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_DEBUG=${API_DEBUG:-false}

      # Base de datos (SQLite en volumen persistente)
      - DATABASE_URL=sqlite:////app/data/chat_messages.db

      # Filtro de contenido
      - PROFANITY_WORDS=${PROFANITY_WORDS:-spam,malo,prohibido,ofensivo}

      # Límites de tasa
      - MAX_CONTENT_LENGTH=${MAX_CONTENT_LENGTH:-5000}
      - MAX_HOURLY_MESSAGES=${MAX_HOURLY_MESSAGES:-100}
      - MAX_MESSAGES_PER_MINUTE=${MAX_MESSAGES_PER_MINUTE:-10}
      
      # Coverage configuration
      - COVERAGE_FILE=/tmp/.coverage

    volumes:
      # Volumen para persistir la base de datos
      - db-data:/app/data
      # Volumen para logs (opcional)
      - ./logs:/app/logs
      # Volumen temporal para coverage (en memoria)
      - type: tmpfs
        target: /tmp

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - chat-network

  # ========================================================================
  # Servicio de desarrollo (opcional - descomentar para usar)
  # ========================================================================
  # api-dev:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: chat-api-dev
  #   ports:
  #     - "8001:8000"
  #   environment:
  #     - API_DEBUG=true
  #     - DATABASE_URL=sqlite:////app/data/chat_messages_dev.db
  #   volumes:
  #     # Hot reload - montar código fuente
  #     - ./app:/app/app
  #     - db-data-dev:/app/data
  #   command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  #   networks:
  #     - chat-network

# ============================================================================
# Volúmenes
# ============================================================================
volumes:
  # Volumen para datos de la base de datos (producción)
  db-data:
    driver: local

  # Volumen para datos de desarrollo (descomentar si usas api-dev)
  # db-data-dev:
  #   driver: local

# ============================================================================
# Redes
# ============================================================================
networks:
  chat-network:
    driver: bridge
